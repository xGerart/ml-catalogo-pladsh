<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1130" width="1000" height="1130" role="img" aria-label="Flujo del proyecto: los nombres del ERP se deduplican; una muestra de 1 000 se etiqueta con asistencia y entrena dos técnicas que se optimizan y comparan estadísticamente; la ganadora, evaluada en un test apartado, categoriza el resto del catálogo y deja los casos dudosos para revisión manual." font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#6b7280"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#b02d62"/></marker>
</defs>
<rect width="1000" height="1130" style="fill:#f5f6f8"/>
<rect x="350" y="20" width="260" height="56" rx="8" stroke-width="1.6" style="fill:#e9ebef;stroke:#5b6573"/>
<text x="480.0" y="44.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#5b6573">Export del ERP</text>
<text x="480.0" y="60.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">11 296 productos · id y nombre</text>
<polyline points="480,76 480,108" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<rect x="350" y="110" width="260" height="56" rx="8" stroke-width="1.6" style="fill:#e9ebef;stroke:#5b6573"/>
<text x="480.0" y="134.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#5b6573">Limpieza y deduplicado</text>
<text x="480.0" y="150.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">10 777 nombres únicos</text>
<rect x="60" y="210" width="240" height="56" rx="8" stroke-width="1.6" style="fill:#dff3ef;stroke:#0f7b6c"/>
<text x="180.0" y="234.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#0f7b6c">Clustering exploratorio</text>
<text x="180.0" y="250.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">k-means → taxonomía de 8 clases</text>
<rect x="360" y="210" width="240" height="56" rx="8" stroke-width="1.6" style="fill:#f8ecdb;stroke:#a55a06"/>
<text x="480.0" y="234.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#a55a06">Muestra aleatoria</text>
<text x="480.0" y="250.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">1 000 productos (semilla 42)</text>
<rect x="850" y="210" width="130" height="56" rx="8" stroke-width="1.6" style="fill:#e9ebef;stroke:#5b6573"/>
<text x="915.0" y="234.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#5b6573">Resto</text>
<text x="915.0" y="250.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">9 777 sin etiqueta</text>
<polyline points="400,166 400,186 180,186 180,208" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="190" y="181" text-anchor="start" font-size="11" style="fill:#6b7280">todo el catálogo</text>
<polyline points="480,166 480,208" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="488" y="194" text-anchor="start" font-size="11" style="fill:#6b7280">al azar</text>
<polyline points="560,166 560,186 915,186 915,208" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="860" y="181" text-anchor="start" font-size="11" style="fill:#6b7280">el resto</text>
<rect x="300" y="310" width="360" height="56" rx="8" stroke-width="1.6" style="fill:#f8ecdb;stroke:#a55a06"/>
<text x="480.0" y="334.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#a55a06">Etiquetado asistido</text>
<text x="480.0" y="350.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">un LLM propone · una persona revisa las 1 000</text>
<polyline points="180,266 180,338 298,338" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="188" y="330" text-anchor="start" font-size="11" style="fill:#6b7280">taxonomía</text>
<polyline points="480,266 480,308" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<rect x="270" y="420" width="230" height="56" rx="8" stroke-width="1.6" style="fill:#e5e8fb;stroke:#3446c2"/>
<text x="385.0" y="444.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#3446c2">Entrenamiento</text>
<text x="385.0" y="460.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">800 productos (80 %)</text>
<rect x="600" y="420" width="220" height="56" rx="8" stroke-width="1.6" style="fill:#f8e3eb;stroke:#b02d62"/>
<text x="710.0" y="444.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#b02d62">Test</text>
<text x="710.0" y="460.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">200 productos · apartado</text>
<polyline points="420,366 420,392 385,392 385,418" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="428" y="388" text-anchor="start" font-size="11" style="fill:#6b7280">split estratificado</text>
<polyline points="540,366 540,392 710,392 710,418" fill="none" stroke-width="1.4" style="stroke:#b02d62" marker-end="url(#m)"/>
<rect x="40" y="505" width="580" height="160" rx="14" fill="none" stroke-width="1.6" stroke-dasharray="6 5" style="stroke:#3446c2"/>
<text x="330" y="523" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing=".04em" style="fill:#3446c2">OPTIMIZACIÓN · GridSearchCV 5 × 3</text>
<rect x="60" y="530" width="260" height="120" rx="8" stroke-width="1.6" style="fill:#e5e8fb;stroke:#3446c2"/>
<text x="190.0" y="562.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#3446c2">Técnica 1</text>
<text x="190.0" y="578.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">TF-IDF de n-gramas</text>
<text x="190.0" y="594.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">de caracteres</text>
<text x="190.0" y="610.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">→ χ² (selección de k)</text>
<text x="190.0" y="626.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">→ regresión logística (C = 1/λ)</text>
<rect x="340" y="530" width="260" height="120" rx="8" stroke-width="1.6" style="fill:#ede6f8;stroke:#6e45b0"/>
<text x="470.0" y="562.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#6e45b0">Técnica 2</text>
<text x="470.0" y="578.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">Word2Vec preentrenado</text>
<text x="470.0" y="594.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">(SBWCE, 300 dimensiones)</text>
<text x="470.0" y="610.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">→ promedio → escalado</text>
<text x="470.0" y="626.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">→ SVM kernel RBF (C, γ)</text>
<polyline points="385,476 385,492 190,492 190,528" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="393" y="488" text-anchor="start" font-size="11" style="fill:#6b7280">nombres y etiquetas</text>
<polyline points="385,476 385,492 470,492 470,528" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<rect x="60" y="715" width="540" height="56" rx="8" stroke-width="1.6" style="fill:#e2f2e4;stroke:#2e7d32"/>
<text x="330.0" y="739.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#2e7d32">Comparación estadística</text>
<text x="330.0" y="755.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">repeated stratified 10 × 10 (mismos folds) → Wilcoxon + t corregido</text>
<polyline points="190,650 190,713" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="198" y="688" text-anchor="start" font-size="11" style="fill:#6b7280">mejor configuración</text>
<polyline points="470,650 470,713" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="478" y="688" text-anchor="start" font-size="11" style="fill:#6b7280">mejor configuración</text>
<rect x="560" y="815" width="300" height="56" rx="8" stroke-width="1.6" style="fill:#f8e3eb;stroke:#b02d62"/>
<text x="710.0" y="839.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#b02d62">Evaluación en test</text>
<text x="710.0" y="855.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">métricas · ROC · matriz de confusión</text>
<polyline points="710,476 710,813" fill="none" stroke-width="1.4" style="stroke:#b02d62" marker-end="url(#m)"/>
<text x="718" y="790" text-anchor="start" font-size="11" style="fill:#b02d62">se usa solo al final</text>
<polyline points="600,743 660,743 660,813" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="604" y="737" text-anchor="start" font-size="11" style="fill:#6b7280">ganadora</text>
<rect x="60" y="815" width="440" height="56" rx="8" stroke-width="1.6" style="fill:#e2f2e4;stroke:#2e7d32"/>
<text x="280.0" y="839.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#2e7d32">Modelo final</text>
<text x="280.0" y="855.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">ganadora reentrenada con los 1 000 · umbral 0,8</text>
<polyline points="330,771 330,813" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="338" y="797" text-anchor="start" font-size="11" style="fill:#6b7280">técnica ganadora</text>
<rect x="250" y="925" width="500" height="56" rx="8" stroke-width="1.6" style="fill:#e9ebef;stroke:#5b6573"/>
<text x="500.0" y="949.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#5b6573">Aplicación al catálogo restante</text>
<text x="500.0" y="965.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">cada producto → categoría predicha + confianza</text>
<polyline points="280,871 280,923" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="288" y="902" text-anchor="start" font-size="11" style="fill:#6b7280">predice</text>
<polyline points="915,266 915,953 752,953" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<text x="908" y="945" text-anchor="end" font-size="11" style="fill:#6b7280">9 777 nombres</text>
<rect x="150" y="1040" width="300" height="56" rx="8" stroke-width="1.6" style="fill:#e2f2e4;stroke:#2e7d32"/>
<text x="300.0" y="1064.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#2e7d32">Categorizado automático</text>
<text x="300.0" y="1080.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">confianza ≥ 0,8</text>
<rect x="550" y="1040" width="300" height="56" rx="8" stroke-width="1.6" style="fill:#e9ebef;stroke:#5b6573"/>
<text x="700.0" y="1064.0" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#5b6573">Revisión manual</text>
<text x="700.0" y="1080.0" text-anchor="middle" font-size="11.5" style="fill:#3d4450">confianza &lt; 0,8 · nombres ambiguos</text>
<polyline points="400,981 400,1010 300,1010 300,1038" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
<polyline points="600,981 600,1010 700,1010 700,1038" fill="none" stroke-width="1.4" style="stroke:#6b7280" marker-end="url(#a)"/>
</svg>
